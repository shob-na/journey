        /* Premium Hollywood Cinema Base */
        body {
            background-color: #030202;

            z-index: 1;
            pointer-events: none;

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;

            pointer-events: none;
        }

        .screen-container {
            text-align: center;

            width: 88%;

            padding: 20px;
            z-index: 6;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 🎬 TRUE HOLLYWOOD HERO TITLE CARD REVEAL (PLAYS FIRST) */
        .hero-title-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: masterTitleReveal 6.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;

        @keyframes masterTitleReveal {
            0% {
                opacity: 0;
                filter: blur(25px) brightness(0);
                transform: scale(0.85) translateZ(-200px);
                letter-spacing: 10px;
            }

            text-transform: uppercase;

        .hero-main-name {
            font-size: 4.5rem;

            0% { opacity: 0; transform: translateY(-50%) scaleX(0.5); }
            50% { opacity: 0.9; transform: translateY(-50%) scaleX(1); }
            100% { opacity: 0; transform: translateY(-50%) scaleX(0.5); }

        .hero-sub-title {
            font-size: 1.25rem;
            color: #ffffff;

            text-transform: uppercase;
            margin-top: 30px;
            font-weight: 400;

        .fade-in {

        .btn-container {

        button {

        button:hover {

    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>
    <div class="vignette"></div>
    <div class="audio-hint" id="sound-hint">🎵 Click or Tap anywhere to turn on audio</div>

    <div class="screen-container" id="viewport"></div>

    <audio id="intro-bgm" loop preload="auto" crossorigin="anonymous">
        <source src="static/bg-music.mp3" type="audio/mpeg">

    <script>
        // ==========================================
        // DYNAMIC METEOR STORM BACKGROUND ENGINE
        // ==========================================
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let meteors = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.3,
                alpha: Math.random(),
                speed: 0.006 + Math.random() * 0.012
            });
        }

        function createMeteor() {
            meteors.push({
                x: Math.random() * canvas.width * 0.6,
                y: -80,
                length: 50 + Math.random() * 80,
                speed: 8 + Math.random() * 9, 
                thickness: 1.2 + Math.random() * 1.5,
                alpha: 1
            });
        }

        function animateSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(255, 140, 50, ${Math.max(0, star.alpha * 0.35)})`;
                ctx.fill();
            });

            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                m.x += m.speed;
                m.y += m.speed * 0.6;
                m.alpha -= 0.015;

                if (m.alpha <= 0 || m.x > canvas.width || m.y > canvas.height) {
                    meteors.splice(i, 1);
                    continue;
                }

                let gradient = ctx.createLinearGradient(m.x, m.y, m.x - m.length, m.y - (m.length * 0.6));
                gradient.addColorStop(0, `rgba(255, 106, 0, ${m.alpha})`); 
                gradient.addColorStop(0.5, `rgba(230, 60, 0, ${m.alpha * 0.5})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.length, m.y - (m.length * 0.6));
                ctx.strokeStyle = gradient;
                ctx.lineWidth = m.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            if (Math.random() < 0.035) createMeteor();
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // ==========================================
        // CINEMATIC SCRIPT SEQUENCE DATA
        // ==========================================
        const introLines = [
            "Hey Shree…",
            "Before we start,",
            "this isn’t an interview preparation video.",
            "And it’s not a test.",
            "It’s just a small reflection of your journey.",
            "Do you remember who you were when it all started?",
            "The days when everything felt new…",
            "the confusion…",
            "the learning…",
            "the small wins no one noticed.",
            "Somewhere along the way…",
            "you grew.",
            "Quietly. Slowly. Consistently.",
            "And now…",
            "you’re standing at the next step.",
            "Not as someone starting.",
            "But as someone becoming.",
            "So let’s do something simple.",
            "Just a few honest questions.",
            "No pressure.",
            "No right answers.",
            "Just you."
        ];

        const scriptData = [
            {
                question: "How are you feeling about the next 30 days?",
                options: [
                    { text: "Excited", msg: "Fair.<br>But remember:<br><br>\"A river cuts through rock not because of its power, but because of its persistence.\"" },
                    { text: "Motivated", msg: "Fair.<br>But remember:<br><br>\"A river cuts through rock not because of its power, but because of its persistence.\"" },
                    { text: "Why are you asking difficult questions already?", msg: "Fair.<br>But remember:<br><br>\"A river cuts through rock not because of its power, but because of its persistence.\"" }
                ]
            },
            {
                question: "What got you this far?",
                options: [
                    { text: "Hard Work", msg: "\"Success is the sum of small efforts repeated daily.\"" },
                    { text: "Consistency", msg: "\"Success is the sum of small efforts repeated daily.\"" },
                    { text: "Accidentally clicked the correct buttons for 3 years", msg: "We'll pretend it's not the third option.<br><br>\"Success is the sum of small efforts daily.\"" }
                ]
            },
            {
                question: "What's your plan for the next 30 days?",
                options: [
                    { text: "Learn", msg: "Stay focused, champion. The backend won't learn itself." },
                    { text: "Practice", msg: "Stay focused, champion. The backend won't learn itself." },
                    { text: "Open YouTube and somehow end up watching cricket highlights", msg: "Stay focused, champion. The backend won't learn itself." }
                ]
            },
            {
                question: "What do you call 3 years of experience?",
                options: [
                    { text: "Growth", msg: "Every challenge taught something. Even the ones that started with a crash." },
                    { text: "Learning", msg: "Every challenge taught something. Even the ones that started with a crash." },
                    { text: "Unlimited screenshots and documentation", msg: "Every challenge taught something. Even the ones that started with a crash." }
                ]
            },
            {
                question: "What is your secret weapon?",
                options: [
                    { text: "Curiosity", msg: "The correct answer is: <span style='color:#ff6a00; font-weight:bold;'>You.</span>" },
                    { text: "Patience", msg: "The correct answer is: <span style='color:#ff6a00; font-weight:bold;'>You.</span>" },
                    { text: "Stack Overflow", msg: "The correct answer is: <span style='color:#ff6a00; font-weight:bold;'>You.</span>" }
                ]
            },
            {
                question: "Suppose future-you visits today. What would he say?",
                options: [
                    { text: "Keep going", msg: "Honestly... Probably all three." },
                    { text: "Trust yourself", msg: "Honestly... Probably all three." },
                    { text: "Bro... start studying", msg: "Honestly... Probably all three." }
                ]
            },
            {
                question: "What should you focus on?",
                options: [
                    { text: "One day at a time", msg: "Whatever works. Just keep moving forward." },
                    { text: "One topic at a time", msg: "Whatever works. Just keep moving forward." },
                    { text: "One coffee at a time", msg: "Whatever works. Just keep moving forward." }
                ]
            },
            {
                question: "How much have you grown?",
                options: [
                    { text: "A little", msg: "Never underestimate progress that happened slowly." },
                    { text: "A lot", msg: "Never underestimate progress that happened slowly." },
                    { text: "Enough that 2023-me would be impressed", msg: "Exactly.<br><br>Never underestimate progress that happened slowly." }
                ]
            },
            {
                question: "Final preparation checklist",
                checklist: ["☑ Confidence", "☑ Curiosity", "☑ Persistence", "☑ Snacks"],
                msg: "Every successful journey needs fuel."
            },
            {
                question: "One final question. Are you ready?",
                options: [
                    { text: "Yes", msg: "Relax. You still have 30 days. And 30 days is plenty of time for someone willing to learn." },
                    { text: "Definitely", msg: "Relax. You still have 30 days. And 30 days is plenty of time for someone willing to learn." },
                    { text: "Wait... when is the interview again?", msg: "Relax. You still have 30 days. And 30 days is plenty of time for someone willing to learn." }
                ]
            }
        ];

        let currentStep = 0;
        let lineIndex = 0;
        const viewport = document.getElementById('viewport');
// ==========================================
// ADVANCED AUDIO LIFECYCLE & 3X AMPLIFIER ENGINE
// ==========================================
const audio = document.getElementById('intro-bgm');

// When the browser encounters a corrupt local file, fallback to the cloud source stream
audio.addEventListener('error', function() {
    console.log("Local audio file issue. Triggering backup stream...");
    audio.src = "https://assets.mixkit.co/music/preview/mixkit-dreaming-big-31.mp3";
    audio.load();
});

let audioCtx = null;
let gainNode = null;

function activateCinemaSound() {
    // 1. Initialize the Hardware Audio Context
    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AudioCtxClass) {
        audioCtx = new AudioCtxClass();
        
        // 2. Route the HTML Audio element into our software amplifier
        const source = audioCtx.createMediaElementSource(audio);
        gainNode = audioCtx.createGain();
        
        // 🛠️ CHOOSE YOUR VOLUME MULTIPLIER HERE:
        // 1.0 = normal, 2.0 = double, 3.0 = triple, 4.0 = quadruple
        gainNode.gain.value = 3.0; 

        // Connect everything: File Input -> Amplifier Node -> Device Speakers
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
    }

    // 3. Force-resume context for modern mobile security gates
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    // 4. Fire the soundtrack play engine
    audio.play()
        .then(() => {
            document.getElementById('sound-hint').style.opacity = '0';
            window.removeEventListener('click', activateCinemaSound);
            window.removeEventListener('touchstart', activateCinemaSound);
        })
        .catch(err => {
            console.log("Playback blocked or asset unreadable. Forcing clean cloud fallback...");
            audio.src = "https://assets.mixkit.co/music/preview/mixkit-dreaming-big-31.mp3";
            audio.load();
            audio.play().then(() => {
                document.getElementById('sound-hint').style.opacity = '0';
            });
        });
}

window.addEventListener('click', activateCinemaSound);
window.addEventListener('touchstart', activateCinemaSound);

        // ==========================================
        // CORE APPLICATION DYNAMICS PIPELINE
        // ==========================================
        function initTimelinePipeline() {
            for(let k=0; k<12; k++) setTimeout(createMeteor, k * 150);

            viewport.innerHTML = `
                <div class="hero-title-card">
                    <div class="hero-codename">Ready for the new Journey</div>
                    <h1 class="hero-main-name">Shreeshail</h1>
                    <div class="hero-sub-title">Backend Developer</div>
                </div>
            `;

            setTimeout(() => {
                runTransition(() => playIntroCrawl());
            }, 6600);
        }

        function playIntroCrawl() {
            if (lineIndex < introLines.length) {
                viewport.innerHTML = `<div class="intro-crawl-text">${introLines[lineIndex]}</div>`;
                lineIndex++;
                setTimeout(playIntroCrawl, 3800);
            } else {
                runTransition(() => renderQuestionScreen());
            }
        }

        function runTransition(callback) {
            viewport.style.opacity = '0';
            viewport.style.transform = 'translateZ(-30px) scale(0.96)';
            setTimeout(() => {
                callback();
                viewport.style.opacity = '1';
                viewport.style.transform = 'translateZ(0) scale(1)';
            }, 600);
        }

        function renderQuestionScreen() {
            const currentData = scriptData[currentStep];
            
            if (currentData.checklist) {
                viewport.innerHTML = `
                    <div class="fade-in">
                        <h2>${currentData.question}</h2>
                        <div id="list-zone"></div>
                        <div class="btn-container" style="margin-top:35px;">
                            <button onclick="showChecklistMessage()">Verify Parameters</button>
                        </div>
                    </div>
                `;
                const listZone = document.getElementById('list-zone');
                currentData.checklist.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = 'checklist-item';
                    el.innerText = item;
                    listZone.appendChild(el);
                    setTimeout(() => el.classList.add('checklist-visible'), index * 250);
                });
            } else {
                let optionsMarkup = '';
                currentData.options.forEach((opt, idx) => {
                    optionsMarkup += `<button onclick="selectOption(${idx})">${opt.text}</button>`;
                });

                viewport.innerHTML = `
                    <div class="fade-in">
                        <h2>${currentData.question}</h2>
                        <div class="btn-container">${optionsMarkup}</div>
                    </div>
                `;
            }
        }

        function selectOption(index) {
            createMeteor();
            displayMessage(scriptData[currentStep].options[index].msg);
        }

        function showChecklistMessage() {
            createMeteor();
            displayMessage(scriptData[currentStep].msg);
        }

        function displayMessage(msgText) {
            viewport.innerHTML = `
                <div class="fade-in">
                    <div class="response-text">${msgText}</div>
                </div>
            `;

            if (currentStep === scriptData.length - 1) {
                setTimeout(() => {
                    const container = document.createElement('div');
                    container.className = 'btn-container fade-in';
                    container.style.marginTop = '25px';
                    container.innerHTML = `<button class="next-btn" onclick="advanceStep()">Read Final Reflection</button>`;
                    viewport.appendChild(container);
                }, 4000);
            } else {
                setTimeout(() => advanceStep(), 8000);
            }
        }

        function advanceStep() {
            currentStep++;
            if (currentStep < scriptData.length) {
                runTransition(() => renderQuestionScreen());
            } else {
                runTransition(() => renderFinalScreen());
            }
        }

        function renderFinalScreen() {
            for(let k=0; k<15; k++) setTimeout(createMeteor, k * 120);

            viewport.innerHTML = `
                <div class="final-scroll">
                    <p style="animation-delay: 0.2s; color: #ff6a00; font-size: 1.4rem; font-weight: 400;">Hey Shree…</p>
                    <p style="animation-delay: 1.8s; color: #ff8822; font-size: 1.25rem;">This is just your journey.</p>
                    <p style="animation-delay: 3.4s; color: #ff8822; font-size: 1.25rem;">No pressure. No rush.</p>
                    
                    <p style="animation-delay: 5.2s; color: #ff6a00; font-weight: 600; font-size: 1.35rem; text-shadow: 0 0 15px rgba(255,106,0,0.4);">You already have what it takes.</p>
                    <p style="animation-delay: 7.0s; color: #ff8822; font-size: 1.25rem;">Now just trust yourself a little more.</p>
                    
                    <p style="animation-delay: 8.8s; color: #ff6a00; font-weight: bold;">Keep learning.</p>
                    <p style="animation-delay: 10.4s; color: #ff6a00; font-weight: bold;">Keep growing.</p>
                    <p style="animation-delay: 12.0s; color: #ff6a00; font-weight: bold;">Keep moving forward.</p>
